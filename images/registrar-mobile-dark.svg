<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="registrar-mobile-dark-title registrar-mobile-dark-desc">
  <title id="registrar-mobile-dark-title">Rules become names</title>
  <desc id="registrar-mobile-dark-desc">The namespace owner sets the rules. Its Registrar applies them and issues alice.nova to a holder.</desc>
  <rect width="600" height="720" fill="#171A19"/>
  <g font-family="Inter, Arial, sans-serif" fill="#EFF4F0">
    <text x="32" y="78" font-size="44" font-weight="600" letter-spacing="-1">Rules become names.</text>
    <text x="32" y="124" font-size="30" fill="#96A59C">From owner policy to holder.</text>

    <g fill="#1D231F" stroke="#35443C" stroke-width="2">
      <rect x="32" y="168" width="536" height="132" rx="12"/>
      <rect x="32" y="354" width="536" height="132" rx="12"/>
      <rect x="32" y="540" width="536" height="148" rx="12"/>
    </g>
    <g fill="none" stroke="#96A59C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M300 311V342 M292 334L300 342L308 334"/>
      <path d="M300 497V528 M292 520L300 528L308 520"/>
    </g>

    <text x="60" y="219" font-size="28" fill="#96A59C">01 / Owner sets policy</text>
    <text x="60" y="270" font-size="42" font-weight="600" letter-spacing="-0.6">Namespace rules</text>

    <text x="60" y="405" font-size="28" fill="#96A59C">02 / Contract applies it</text>
    <text x="60" y="456" font-size="42" font-weight="600" letter-spacing="-0.6">Registrar</text>
    <path d="M493 438L505 450L527 425" fill="none" stroke="#84D4AC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="60" y="587" font-size="28" fill="#96A59C">03 / Name issued to holder</text>
    <rect x="60" y="609" width="300" height="56" rx="6" fill="#253D30"/>
    <text x="78" y="651" font-size="42" font-weight="600" letter-spacing="-1" fill="#84D4AC">alice.nova</text>
  </g>
</svg>
