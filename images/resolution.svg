<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="title desc">
<title id="title">A name resolves to different kinds of records</title>
<desc id="desc">An application supplies alice.nova to Soran Lookup and selects a record type. Lookup returns Stellar address and memo details, a profile, or an enabled network address. This reads records and does not send a payment.</desc>
<rect width="1200" height="650" fill="#F5F7F6"/>
<g font-family="Inter, Arial, sans-serif" fill="#16251E">

<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#65756D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="56" y="68" font-size="22" font-weight="650" letter-spacing="2" fill="#267254">NAME RESOLUTION</text>
<text x="56" y="127" font-size="42" font-weight="650" letter-spacing="-1.3">One name. Different kinds of records.</text>

<rect x="56" y="250" width="288" height="176" rx="24" fill="#FFFFFF" stroke="#D9E2DC" stroke-width="2"/>
<text x="82" y="294" font-size="22" font-weight="600" letter-spacing="1.1" fill="#65756D">NAME TO LOOK UP</text>
<text x="81" y="361" font-size="44" font-weight="650" letter-spacing="-1.6">alice<tspan fill="#267254">.nova</tspan></text>

<path d="M360 338H412" fill="none" stroke="#65756D" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="430" y="250" width="286" height="176" rx="24" fill="#E7F0E9" stroke="#D9E2DC" stroke-width="2"/>
<text x="456" y="294" font-size="22" font-weight="600" letter-spacing="1.1" fill="#267254">SHARED LOOKUP</text>
<text x="454" y="349" font-size="35" font-weight="650" letter-spacing="-1">Soran Lookup</text>
<text x="456" y="389" font-size="22" fill="#65756D">Read by record type</text>

<path d="M732 338H766M766 225V451M766 225H800M766 338H800M766 451H800" fill="none" stroke="#D9E2DC" stroke-width="2.5"/>
<circle cx="766" cy="338" r="5" fill="#267254"/>
<path d="M789 225H800M789 338H800M789 451H800" fill="none" stroke="#65756D" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="818" y="178" width="326" height="96" rx="18" fill="#FFFFFF" stroke="#D9E2DC" stroke-width="2"/>
<rect x="818" y="194" width="4" height="64" rx="2" fill="#267254"/>
<text x="842" y="219" font-size="28" font-weight="600" letter-spacing="-.6">Address + memo</text>
<text x="842" y="252" font-size="22" fill="#65756D">Stellar payment details</text>

<rect x="818" y="290" width="326" height="96" rx="18" fill="#FFFFFF" stroke="#D9E2DC" stroke-width="2"/>
<rect x="818" y="306" width="4" height="64" rx="2" fill="#74509C"/>
<text x="842" y="331" font-size="28" font-weight="600" letter-spacing="-.6">Profile</text>
<text x="842" y="364" font-size="22" fill="#65756D">Avatar, bio and links</text>

<rect x="818" y="402" width="326" height="96" rx="18" fill="#FFFFFF" stroke="#D9E2DC" stroke-width="2"/>
<rect x="818" y="418" width="4" height="64" rx="2" fill="#305FA7"/>
<text x="842" y="443" font-size="28" font-weight="600" letter-spacing="-.8">Network addresses</text>
<text x="842" y="476" font-size="22" fill="#65756D">For enabled networks</text>

<path d="M56 558H1144" stroke="#D9E2DC" stroke-width="2"/>
<text x="56" y="594" font-size="24" fill="#65756D">A lookup reads records. It does not send a payment.</text>
</g>
</svg>
