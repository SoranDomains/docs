<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="title desc">
<title id="title">One parent name, distinct subnames</title>
<desc id="desc">Alice controls alice.nova and its subnames pay.alice.nova and shop.alice.nova. Each child can have separate records, supports one child level, and follows the parent lifetime.</desc>
<rect width="1200" height="650" fill="#171A19"/>
<g font-family="Inter, Arial, sans-serif" fill="#EFF4F0">

<text x="56" y="68" font-size="22" font-weight="650" letter-spacing="2" fill="#84D4AC">SUBNAMES</text>
<text x="56" y="127" font-size="42" font-weight="650" letter-spacing="-1.3">Your name can do more.</text>

<rect x="56" y="194" width="410" height="342" rx="24" fill="#202623" stroke="#35443C" stroke-width="2"/>
<text x="84" y="240" font-size="22" font-weight="600" letter-spacing="1.1" fill="#96A59C">PARENT NAME</text>
<text x="82" y="310" font-size="57" font-weight="650" letter-spacing="-2">alice<tspan fill="#84D4AC">.nova</tspan></text>
<path d="M84 340H438" stroke="#35443C" stroke-width="2"/>
<text x="84" y="384" font-size="24">Alice controls this name</text>
<text x="84" y="419" font-size="24">and each subname.</text>
<rect x="84" y="459" width="264" height="46" rx="10" fill="#243C30"/>
<text x="104" y="489" font-size="22" font-weight="600" fill="#84D4AC">One extra name level</text>

<path d="M466 365H520M520 274V456M520 274H566M520 456H566" fill="none" stroke="#35443C" stroke-width="2.5"/>
<circle cx="520" cy="365" r="5" fill="#84D4AC"/>
<path d="M558 267L566 274L558 281M558 449L566 456L558 463" fill="none" stroke="#96A59C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="578" y="194" width="566" height="160" rx="24" fill="#202623" stroke="#35443C" stroke-width="2"/>
<rect x="602" y="218" width="93" height="62" rx="13" fill="#263449"/>
<text x="615" y="262" font-size="40" font-weight="650" letter-spacing="-1" fill="#9BBEFA">pay</text>
<text x="699" y="262" font-size="40" font-weight="600" letter-spacing="-1.1">.alice.nova</text>
<text x="604" y="317" font-size="23" fill="#96A59C">A separate receiving destination</text>

<rect x="578" y="376" width="566" height="160" rx="24" fill="#202623" stroke="#35443C" stroke-width="2"/>
<rect x="602" y="400" width="117" height="62" rx="13" fill="#362E42"/>
<text x="614" y="444" font-size="40" font-weight="650" letter-spacing="-1" fill="#C7ACEC">shop</text>
<text x="723" y="444" font-size="40" font-weight="600" letter-spacing="-1.1">.alice.nova</text>
<text x="604" y="499" font-size="23" fill="#96A59C">Its own profile and address records</text>

<path d="M56 560H1144" stroke="#35443C" stroke-width="2"/>
<text x="56" y="594" font-size="23" fill="#96A59C">Parent-controlled</text>
<circle cx="294" cy="586" r="3" fill="#96A59C"/>
<text x="321" y="594" font-size="23" fill="#96A59C">Separate records</text>
<circle cx="552" cy="586" r="3" fill="#96A59C"/>
<text x="579" y="594" font-size="23" fill="#96A59C">Follows the parent’s lifetime</text>
</g>
</svg>
