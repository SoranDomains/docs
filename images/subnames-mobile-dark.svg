<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720" role="img" aria-labelledby="title desc">
<title id="title">Parent-controlled subnames</title><desc id="desc">The parent name alice.nova controls one child level, including pay.alice.nova for payment details and shop.alice.nova for profile and address records. Children have separate records and share the parent lifetime.</desc>
<rect width="600" height="720" fill="#171A19"/>
<g font-family="Inter, Arial, sans-serif" fill="#EFF4F0">

<text x="34" y="62" font-size="28" font-weight="650" letter-spacing="1.6" fill="#84D4AC">SUBNAMES</text>
<text x="34" y="118" font-size="40" font-weight="650" letter-spacing="-1.2">One parent name.</text>
<rect x="34" y="148" width="532" height="133" rx="22" fill="#202623" stroke="#35443C" stroke-width="2"/>
<text x="58" y="190" font-size="28" font-weight="600" fill="#96A59C">PARENT NAME</text>
<text x="56" y="252" font-size="50" font-weight="650" letter-spacing="-1.8">alice<tspan fill="#84D4AC">.nova</tspan></text>
<path d="M300 282V305H48V524M48 382H72M48 524H72" fill="none" stroke="#35443C" stroke-width="2.5"/>
<circle cx="300" cy="282" r="4" fill="#84D4AC"/>
<path d="M64 375L72 382L64 389M64 517L72 524L64 531" fill="none" stroke="#96A59C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="84" y="323" width="482" height="121" rx="20" fill="#202623" stroke="#35443C" stroke-width="2"/>
<rect x="104" y="342" width="88" height="54" rx="11" fill="#263449"/>
<text x="114" y="382" font-size="40" font-weight="650" letter-spacing="-1.2" fill="#9BBEFA">pay</text>
<text x="196" y="382" font-size="40" font-weight="600" letter-spacing="-1.3">.alice.nova</text>
<text x="106" y="422" font-size="28" fill="#96A59C">Payment details</text>
<rect x="84" y="464" width="482" height="121" rx="20" fill="#202623" stroke="#35443C" stroke-width="2"/>
<rect x="104" y="483" width="113" height="54" rx="11" fill="#362E42"/>
<text x="114" y="523" font-size="40" font-weight="650" letter-spacing="-1.2" fill="#C7ACEC">shop</text>
<text x="221" y="523" font-size="40" font-weight="600" letter-spacing="-1.3">.alice.nova</text>
<text x="106" y="563" font-size="28" fill="#96A59C">Profile and addresses</text>
<path d="M34 610H566" stroke="#35443C" stroke-width="2"/>
<text x="34" y="648" font-size="30" font-weight="600">Parent-controlled. One child level.</text>
<text x="34" y="680" font-size="28" fill="#96A59C">Separate records. Shared lifetime.</text>
</g></svg>
