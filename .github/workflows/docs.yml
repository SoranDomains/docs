name: Validate documentation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Install standalone Lookup example
        run: npm ci --prefix examples/universal-lookup --ignore-scripts --no-audit --fund=false
      - name: Verify return vectors and decoder
        run: npm test --prefix examples/universal-lookup
